# 复制为 settings.yaml 或直接用环境变量。所有 key 走环境变量，不进仓库。
#
# 剧本/外科医生 LLM（OpenAI-compatible；国产模型中文文案更地道且便宜）
#   LLM_BASE_URL=https://api.deepseek.com/v1
#   LLM_API_KEY=sk-...
#   LLM_MODEL=deepseek-chat
#
# 判官 VLM（便宜的多模态即可，别用旗舰烧钱看帧）
#   JUDGE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
#   JUDGE_API_KEY=sk-...
#   JUDGE_MODEL=qwen-vl-plus
#
# 视频生成（可灵 via 百炼）
#   DASHSCOPE_API_KEY=sk-...
#   KLING_MODEL=<以百炼控制台模型名为准>
