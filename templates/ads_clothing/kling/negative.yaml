# 服饰电商广告 × 可灵 —— 负面约束库 v1
#
# 规则：每条约束必须带 reason（哪次翻车、什么现象）。
# 内环 prompt 外科医生新增的约束先落在 run log 里，外环周会审核后才合入本文件。
# 这份文件是公司资产：约束是积累出来的，不是提示词工程师每天现写的。

constraints:
  - term: "手指畸变, 多余手指, 手部扭曲"
    reason: "服装展示大量手部特写，手崩是最高频废片原因"
  - term: "衣服logo模糊, 商标变形, 文字乱码"
    reason: "商家验收红线：logo/吊牌变形一票否决"
  - term: "服装颜色偏移, 面料材质失真"
    reason: "商品保真点，色差会导致退货纠纷，客户明确要求"
  - term: "面部扭曲, 五官漂移, 眼神涣散"
    reason: "模特面部崩坏在竖屏特写下极其显眼"
  - term: "肢体穿模, 手穿过衣服, 布料穿透身体"
    reason: "转身/整理衣领动作高发穿模"
  - term: "画面闪烁, 帧间跳变, 突然换装"
    reason: "图生视频中后段容易发生主体漂移，衣服款式突变"
  - term: "多余人物, 背景人群面部清晰"
    reason: "背景路人脸清晰会引入肖像权风险，统一虚化"
  - term: "水印, 平台logo, 字幕乱入"
    reason: "训练数据残留的水印偶发出现"
  - term: "夸张运镜, 快速变焦, 镜头旋转"
    reason: "电商广告要稳，模型自由发挥的炫技运镜观感廉价"
