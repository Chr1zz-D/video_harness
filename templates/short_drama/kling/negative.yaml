constraints:
- term: 角色换脸, 五官漂移, 面部特征改变
  reason: 短剧跨镜头角色一致性是第一大废片原因，判官侧配合角色卡保真点核对
- term: 服装突变, 发型突变, 妆容改变
  reason: 同场景连续镜头间人物外观必须锁定
- term: 手指畸变, 多余手指, 肢体扭曲
  reason: 对手戏（递物/拉手/推搡）高发
- term: 口型与情绪不符, 面部僵硬无表情
  reason: 情绪戏面瘫是短剧观感崩塌点；台词镜头后续走口型驱动另行处理
- term: 背景人物盯镜头, 背景人物动作诡异
  reason: 路人穿帮出戏
- term: 画面闪烁, 场景元素突变, 道具消失
  reason: 关键道具（信物/证据类）中途消失会破坏剧情逻辑
- term: 文字乱码, 水印, 字幕乱入
  reason: 训练数据残留
- term: 镜头无故旋转, 突兀变焦
  reason: 叙事镜头要服务情绪，不要炫技
- term: 服装颜色漂移
  reason: 外环学习入库：9次追加中9次伴随翻盘
- term: 六指
  reason: 外环学习入库：9次追加中9次伴随翻盘
